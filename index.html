<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 p-4 sm:p-8 font-sans">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600">Expense Tracker</h1>
            <p class="text-gray-600">Track your income and daily expenses easily</p>
        </header>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-4 rounded shadow text-center">
                <h3 class="text-gray-500 font-semibold">Total Balance</h3>
                <p id="balance" class="text-2xl font-bold text-blue-600">0.00</p>
            </div>
            <div class="bg-white p-4 rounded shadow text-center">
                <h3 class="text-gray-500 font-semibold">Total Income</h3>
                <p id="income" class="text-2xl font-bold text-green-600">0.00</p>
            </div>
            <div class="bg-white p-4 rounded shadow text-center">
                <h3 class="text-gray-500 font-semibold">Total Expense</h3>
                <p id="expense" class="text-2xl font-bold text-red-600">0.00</p>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded shadow">
                <h2 id="form-title" class="text-xl font-bold mb-4 text-gray-700">Add New Transaction</h2>
                <form id="transaction-form" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="edit-id">
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Type</label>
                        <select id="type" class="w-full border p-2 rounded">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Amount</label>
                        <input type="number" id="amount" step="0.01" class="w-full border p-2 rounded" placeholder="Enter amount" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Category</label>
                        <select id="category" class="w-full border p-2 rounded">
                            <option value="Food">Food</option>
                            <option value="Housing">Housing</option>
                            <option value="Transport">Transport</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Salary">Salary</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Date</label>
                        <input type="date" id="date" class="w-full border p-2 rounded" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">Description</label>
                        <input type="text" id="description" class="w-full border p-2 rounded" placeholder="What is this for?" required>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded font-bold hover:bg-blue-700">Save Transaction</button>
                </form>
            </div>
            <div class="space-y-6">
                <div class="bg-white p-4 rounded shadow flex flex-col sm:flex-row gap-4">
                    <select id="filter-type" onchange="filterTransactions()" class="border p-2 rounded flex-1">
                        <option value="all">All Types</option>
                        <option value="income">Income Only</option>
                        <option value="expense">Expense Only</option>
                    </select>
                    <select id="filter-category" onchange="filterTransactions()" class="border p-2 rounded flex-1">
                        <option value="all">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Housing">Housing</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Salary">Salary</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="bg-white p-4 rounded shadow">
                    <h3 class="text-lg font-bold mb-2 text-gray-700">Expense Chart</h3>
                    <canvas id="myChart"></canvas>
                </div>
            </div>
        </div>
        <div class="bg-white p-6 rounded shadow mt-8">
            <h2 class="text-xl font-bold mb-4 text-gray-700">Transaction History</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b">
                            <th class="p-3">Date</th>
                            <th class="p-3">Description</th>
                            <th class="p-3">Category</th>
                            <th class="p-3">Amount</th>
                            <th class="p-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-table-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
